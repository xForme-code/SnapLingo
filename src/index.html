<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>SnapLingo</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      body { padding: 28px 32px; line-height: 1.7; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      kbd {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px; padding: 1px 5px;
        border: 1px solid var(--border); border-radius: 4px;
        background: var(--bg-soft);
      }
      ul { padding-left: 20px; }
    </style>
  </head>
  <body>
    <h1>SnapLingo</h1>
    <p class="muted">跨平台划词翻译 · 截图取词 · 内容提取。程序常驻在菜单栏 / 系统托盘。</p>
    <ul>
      <li>在任意 App 里选中文字 → 弹出图标条</li>
      <li><kbd>⌥⇧T</kbd> 翻译选中内容</li>
      <li><kbd>⌥⇧A</kbd> 截图取词（OCR）</li>
      <li><kbd>⌥⇧C</kbd> 加入收集夹　<kbd>⌥⇧D</kbd> 打开收集夹</li>
    </ul>
    <p class="muted tiny">Windows / Linux 上把 ⌥ 换成 Alt。快捷键可在设置里改。</p>
  </body>
</html>

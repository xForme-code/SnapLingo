<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>SnapLingo</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      /* 阴影余量放在 body 的 padding 上，不能放在面板的 margin 上。
         .panel 是 height:100%，等于窗口高度；再加上下 margin 会让总高变成
         窗口+32px，多出来的部分被裁掉——表现就是底部两个圆角不见了。
         common.css 里有 box-sizing:border-box，padding 会算进 100% 之内。 */
      body {
        padding: 16px;
      }

      /* 窗口无边框且透明，整块面板的形状由这一层决定。
         margin 必须大于阴影的扩散范围：窗口边界会把画不下的阴影**硬切**成
         一个灰色矩形，看起来就像贴图没贴全。所以阴影用 0 3px 12px（向外最多
         15px），margin 给到 16px，刚好兜住。 */
      .panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 3px 12px rgba(15, 20, 30, 0.18), 0 1px 3px rgba(15, 20, 30, 0.12);
        overflow: hidden;
        animation: rise 0.14s ease-out;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(-4px) scale(0.985);
        }
      }

      /* ---------------------------------------------------- 顶部语言栏 */
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 11px 12px 9px;
        flex-shrink: 0;
      }

      .arrow {
        color: var(--text-faint);
        flex-shrink: 0;
      }

      /* 提取模式下面板只做一件事：把识别到的文字原样摆出来供复制。
         语言选择、重新翻译、显示原文在这个场景里都没有意义，一律藏掉。 */
      .panel-title {
        display: none;
        flex: 1;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }

      body.extract .panel-title { display: block; }
      body.extract #source,
      body.extract #target,
      body.extract .arrow,
      body.extract #retry,
      body.extract #originToggle { display: none; }

      /* 两个语言选择器等宽，视觉上是对等的一组 */
      #source,
      #target {
        flex: 1;
        min-width: 0;
        height: 33px;
        padding: 0 9px;
        font-size: 12.5px;
        border-radius: 9px;
      }

      /* 源语言默认是自动检测，存在感弱一点，避免和目标语言抢注意力 */
      #source {
        color: var(--text-dim);
      }

      .close {
        flex-shrink: 0;
        width: 26px;
        height: 26px;
        padding: 0;
        justify-content: center;
        border: none;
        background: transparent;
        border-radius: 8px;
        color: var(--text-faint);
      }

      .close:hover {
        background: var(--bg-sunken);
        color: var(--text);
      }

      /* ---------------------------------------------------- 译文 */
      main {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 3px 16px 12px;
        font-size: 14.5px;
        line-height: 1.72;
        white-space: pre-wrap;
        word-break: break-word;
        -webkit-user-select: text;
        user-select: text;
      }

      main.markdown {
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.7;
      }

      main.error {
        color: var(--danger);
        font-size: 13px;
      }

      .placeholder {
        color: var(--text-faint);
        font-size: 13px;
      }

      /* 语言包下载引导：要显眼到用户不会误以为程序坏了 */
      .notice {
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--text-dim);
        /* main 为了保留译文换行开了 pre-wrap，这里必须关掉，
           否则 HTML 里的缩进会被当成真实空行渲染出来 */
        white-space: normal;
      }

      .notice-title {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 7px;
      }

      .notice p {
        margin: 0 0 7px;
      }

      .notice b {
        color: var(--text);
      }

      .notice-dim {
        color: var(--text-faint);
        font-size: 11.5px;
      }

      .notice-btn {
        margin-top: 4px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 7px 14px;
        font-size: 12.5px;
      }

      .notice-btn:hover:not(:disabled) {
        background: var(--accent-hover);
        color: #fff;
      }

      .notice-btn:disabled {
        opacity: 0.6;
      }

      /* 骨架屏：翻译要等网络，给一个「正在出内容」的形状比转圈更安静 */
      .skeleton span {
        display: block;
        height: 11px;
        margin-bottom: 9px;
        border-radius: 6px;
        background: linear-gradient(
          90deg,
          var(--bg-sunken) 25%,
          var(--bg-soft) 37%,
          var(--bg-sunken) 63%
        );
        background-size: 300% 100%;
        animation: shimmer 1.15s ease-in-out infinite;
      }

      .skeleton span:nth-child(2) {
        width: 92%;
      }
      .skeleton span:nth-child(3) {
        width: 74%;
      }

      @keyframes shimmer {
        from {
          background-position: 150% 0;
        }
        to {
          background-position: -50% 0;
        }
      }

      /* ---------------------------------------------------- 底部操作 */
      footer {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 7px 10px 9px;
        flex-shrink: 0;
        border-top: 1px solid var(--border);
      }

      .act {
        width: 30px;
        height: 28px;
        padding: 0;
        justify-content: center;
        border: none;
        background: transparent;
        border-radius: 8px;
        color: var(--text-dim);
      }

      .act:hover:not(:disabled) {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .act.done {
        color: var(--accent);
      }

      /* 提醒条：存在感要低于译文，但看得见 */
      .hint-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px 7px 16px;
        flex-shrink: 0;
        border-top: 1px solid var(--border);
        background: var(--accent-soft);
        color: var(--text-dim);
        font-size: 11.5px;
      }

      /* 作者样式的 display:flex 会盖掉浏览器默认的 [hidden]{display:none}，
         必须显式补一条，否则 hidden 属性形同虚设 */
      .hint-bar[hidden] {
        display: none;
      }

      .hint-bar span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .hint-bar button {
        border: none;
        background: transparent;
        color: var(--accent);
        font-size: 11.5px;
        padding: 3px 6px;
        border-radius: 6px;
        flex-shrink: 0;
      }

      .hint-bar button:hover {
        background: var(--bg-elevated);
        color: var(--accent);
      }

      .hint-bar #hintDismiss {
        color: var(--text-faint);
      }

      .engine {
        margin-left: 8px;
        color: var(--text-faint);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .origin-toggle {
        margin-left: auto;
        border: none;
        background: transparent;
        color: var(--text-faint);
        font-size: 11.5px;
        padding: 5px 7px;
      }

      .origin-toggle:hover {
        background: transparent;
        color: var(--text-dim);
      }

      /* 原文默认收起：用户刚刚才选中过它，不该占掉译文的位置 */
      .origin {
        display: none;
        padding: 9px 16px 11px;
        margin: 0 0 2px;
        border-top: 1px dashed var(--border);
        color: var(--text-dim);
        font-size: 12.5px;
        line-height: 1.6;
        max-height: 96px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        flex-shrink: 0;
        -webkit-user-select: text;
        user-select: text;
      }

      .origin.open {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <header data-tauri-drag-region>
        <span class="panel-title" id="panelTitle">提取文字</span>
        <select id="source" title="原文语言。自动检测在短词、简繁体上会认错，可手动指定"></select>
        <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
        <select id="target" title="目标语言"></select>
        <button class="close" id="close" title="关闭　Esc">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </header>

      <main id="output">
        <div class="placeholder">选中文字后会在这里显示译文</div>
      </main>

      <div class="origin" id="origin"></div>

      <!-- 联网译成时的一次性提醒：可以顺手备一份离线包。可关闭，不打断使用。 -->
      <div class="hint-bar" id="hint" hidden>
        <span>想断网时也能翻译？可下载离线语言包</span>
        <button id="hintSettings">去设置</button>
        <button id="hintDismiss" title="不再提示">✕</button>
      </div>

      <footer>
        <button class="act" id="copy" title="复制译文">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2" />
            <path d="M5 15V5a2 2 0 0 1 2-2h8" />
          </svg>
        </button>
        <button class="act" id="retry" title="重新翻译　⌘↩">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <path d="M21 3v6h-6" />
          </svg>
        </button>
        <!-- 让用户知道这句是云端译的还是离线译的，质量预期不一样 -->
        <span class="engine" id="engine"></span>
        <button class="origin-toggle" id="originToggle">显示原文</button>
      </footer>
    </div>

    <script type="module" src="result.js"></script>
  </body>
</html>
